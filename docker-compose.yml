# Starts our database with: docker compose up -d

services:
  db:
    # PostgreSQL 16 with the "pgvector" add-on (used for the AI search in the help articles)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
      POSTGRES_DB: supportdesk
    ports:
      # "port on your PC : port inside Docker"
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Keeps the data saved when the container stops
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
